<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="질문서랍 Question Drawer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F8FF7"/>
      <stop offset="1" stop-color="#1A5FC8"/>
    </linearGradient>
    <radialGradient id="topglow" cx="0.3" cy="0.1" r="0.95">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cabinet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E2E8F1"/>
    </linearGradient>
    <linearGradient id="drawer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F9FC"/>
      <stop offset="1" stop-color="#E9EEF5"/>
    </linearGradient>
    <!-- recessed handle: diagonal inner shadow, darkest at the top-left -->
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#AEB9C9"/>
      <stop offset="0.55" stop-color="#DCE3EC"/>
      <stop offset="1" stop-color="#F3F6FA"/>
    </linearGradient>
    <filter id="cabinetsh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4.5" flood-color="#0B3A86" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="128" height="128" rx="29" fill="url(#bg)"/>
  <rect width="128" height="128" rx="29" fill="url(#topglow)"/>

  <!-- centered filing cabinet -->
  <g filter="url(#cabinetsh)">
    <rect x="32" y="22" width="64" height="84" rx="10" fill="url(#cabinet)"/>
  </g>

  <!-- top drawer -->
  <rect x="38.75" y="28.75" width="50.5" height="33.5" rx="6" fill="url(#drawer)" stroke="#C9D3E0" stroke-width="1.5"/>
  <rect x="53" y="36" width="22" height="8" rx="2" fill="url(#handle)" stroke="#CDD5E0" stroke-width="1"/>

  <!-- bottom drawer -->
  <rect x="38.75" y="65.75" width="50.5" height="33.5" rx="6" fill="url(#drawer)" stroke="#C9D3E0" stroke-width="1.5"/>
  <rect x="53" y="73" width="22" height="8" rx="2" fill="url(#handle)" stroke="#CDD5E0" stroke-width="1"/>
</svg>
