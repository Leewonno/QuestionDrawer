<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="질문서랍 Question Drawer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#F8FAFE"/>
      <stop offset="1" stop-color="#F2F6FE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.18" r="0.85">
      <stop offset="0" stop-color="#4285F4" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#4285F4" stop-opacity="0"/>
    </radialGradient>
    <!-- drawer panel surface: white with a faint blue glow rising from the bottom (matches qd-glow) -->
    <radialGradient id="panelglow" cx="0.25" cy="1" r="1" gradientTransform="translate(0.25 1) scale(1.1 0.28) translate(-0.25 -1)">
      <stop offset="0" stop-color="#4285F4" stop-opacity="0.10"/>
      <stop offset="0.75" stop-color="#4285F4" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#1F2430" flood-opacity="0.10"/>
    </filter>
    <filter id="cardsh" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1F2430" flood-opacity="0.05"/>
    </filter>

    <!-- app icon (matches store-icon-128) -->
    <linearGradient id="icbg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F8FF7"/>
      <stop offset="1" stop-color="#1A5FC8"/>
    </linearGradient>
    <radialGradient id="ictopglow" cx="0.3" cy="0.1" r="0.95">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iccabinet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E2E8F1"/>
    </linearGradient>
    <linearGradient id="icdrawer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F9FC"/>
      <stop offset="1" stop-color="#E9EEF5"/>
    </linearGradient>
    <linearGradient id="ichandle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#AEB9C9"/>
      <stop offset="0.55" stop-color="#DCE3EC"/>
      <stop offset="1" stop-color="#F3F6FA"/>
    </linearGradient>
    <filter id="iccabinetsh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4.5" flood-color="#0B3A86" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="24" fill="url(#glow)"/>

  <!-- subtle dotted grid -->
  <g fill="#1A67D2" opacity="0.08">
    <circle cx="60" cy="60" r="2.4"/><circle cx="120" cy="60" r="2.4"/><circle cx="180" cy="60" r="2.4"/>
    <circle cx="60" cy="120" r="2.4"/><circle cx="120" cy="120" r="2.4"/><circle cx="180" cy="120" r="2.4"/>
    <circle cx="60" cy="180" r="2.4"/><circle cx="120" cy="180" r="2.4"/>
  </g>

  <!-- left: text -->
  <g transform="translate(80, 132)">
    <!-- app icon mark (matches store-icon-128) -->
    <g transform="translate(0,-76) scale(0.359375)">
      <rect width="128" height="128" rx="29" fill="url(#icbg)"/>
      <rect width="128" height="128" rx="29" fill="url(#ictopglow)"/>
      <g filter="url(#iccabinetsh)">
        <rect x="32" y="22" width="64" height="84" rx="10" fill="url(#iccabinet)"/>
      </g>
      <rect x="38.75" y="28.75" width="50.5" height="33.5" rx="6" fill="url(#icdrawer)" stroke="#C9D3E0" stroke-width="1.5"/>
      <rect x="53" y="36" width="22" height="8" rx="2" fill="url(#ichandle)" stroke="#CDD5E0" stroke-width="1"/>
      <rect x="38.75" y="65.75" width="50.5" height="33.5" rx="6" fill="url(#icdrawer)" stroke="#C9D3E0" stroke-width="1.5"/>
      <rect x="53" y="73" width="22" height="8" rx="2" fill="url(#ichandle)" stroke="#CDD5E0" stroke-width="1"/>
    </g>
    <text x="0" y="52" font-family="'Pretendard','Apple SD Gothic Neo','Segoe UI',sans-serif" font-size="76" font-weight="800" fill="#1F2430" letter-spacing="-1">질문서랍</text>
    <text x="4" y="96" font-family="'Pretendard','Apple SD Gothic Neo','Segoe UI',sans-serif" font-size="26" font-weight="800" fill="#1A67D2" letter-spacing="2">QUESTION&#160;DRAWER</text>
    <text x="4" y="140" font-family="'Pretendard','Apple SD Gothic Neo','Segoe UI',sans-serif" font-size="22" font-weight="500" fill="#6B7385">궁금한 부분을 드래그해 담아두면,</text>
    <text x="4" y="170" font-family="'Pretendard','Apple SD Gothic Neo','Segoe UI',sans-serif" font-size="22" font-weight="500" fill="#6B7385">클릭 한 번으로 후속 질문을 꽂아주는 확장</text>
  </g>

  <!-- right: drawer illustration (matches real UI) -->
  <g transform="translate(720, 44)" filter="url(#soft)">
    <!-- drawer panel -->
    <rect x="0" y="0" width="400" height="312" rx="20" fill="#FFFFFF"/>
    <rect x="0" y="0" width="400" height="312" rx="20" fill="url(#panelglow)"/>
    <rect x="0.75" y="0.75" width="398.5" height="310.5" rx="19.25" stroke="#EAEEF4" stroke-width="1.5"/>
    <!-- drawer toggle tab (matches real 서랍 열기/닫기 button) -->
    <g filter="url(#cardsh)">
      <path d="M 0 136 L -18 136 Q -26 136 -26 144 L -26 168 Q -26 176 -18 176 L 0 176" fill="#FFFFFF" stroke="#EAEEF4" stroke-width="1.2"/>
      <text x="-13" y="162" text-anchor="middle" font-family="'Pretendard','Segoe UI',sans-serif" font-size="17" font-weight="600" fill="#6B7385">&#8250;</text>
    </g>

    <!-- header -->
    <g transform="translate(24,24)">
      <text x="0" y="16" font-family="'Pretendard','Segoe UI',sans-serif" font-size="17" font-weight="700" fill="#1F2430">질문서랍</text>
      <text x="0" y="40" font-family="'Pretendard','Segoe UI',sans-serif" font-size="12" font-weight="500" fill="#6B7385">담긴 질문 2개</text>
      <!-- header buttons: EN · + · gear -->
      <g font-family="'Pretendard','Segoe UI',sans-serif" fill="#6B7385">
        <rect x="256.75" y="-1.25" width="28.5" height="28.5" rx="8" fill="#FFFFFF" stroke="#EAEEF4" stroke-width="1.5"/>
        <text x="271" y="17.5" text-anchor="middle" font-size="11" font-weight="600">EN</text>
        <rect x="290.75" y="-1.25" width="28.5" height="28.5" rx="8" fill="#FFFFFF" stroke="#EAEEF4" stroke-width="1.5"/>
        <text x="305" y="19" text-anchor="middle" font-size="17" font-weight="500">+</text>
        <rect x="324.75" y="-1.25" width="28.5" height="28.5" rx="8" fill="#FFFFFF" stroke="#EAEEF4" stroke-width="1.5"/>
        <g transform="translate(331,5) scale(0.6667)" fill="none" stroke="#6B7385" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
          <circle cx="12" cy="12" r="3"/>
        </g>
      </g>
    </g>

    <!-- card 1: normal question -->
    <g transform="translate(16,80)" filter="url(#cardsh)">
      <rect x="0.5" y="0.5" width="367" height="53" rx="14" fill="#FFFFFF" stroke="#EAEEF4" stroke-width="1"/>
      <circle cx="20" cy="27" r="3.5" fill="#1A67D2"/>
      <text x="34" y="32" font-family="'Pretendard','Segoe UI',sans-serif" font-size="14" font-weight="500" fill="#1F2430">질문서랍에 대해 자세히 설명해줘</text>
    </g>

    <!-- card 2: highlighted (방금 담김) -->
    <g transform="translate(16,146)" filter="url(#cardsh)">
      <rect x="0.75" y="0.75" width="366.5" height="70.5" rx="14" fill="#F5F8FF" stroke="#1A67D2" stroke-width="1.5"/>
      <circle cx="20" cy="36" r="3.5" fill="#1A67D2"/>
      <text x="34" y="31" font-family="'Pretendard','Segoe UI',sans-serif" font-size="14" font-weight="500" fill="#1F2430">취향에 대해 자세히 설명해줘</text>
      <text x="34" y="52" font-family="'Pretendard','Segoe UI',sans-serif" font-size="12" font-weight="500" fill="#1A67D2">방금 담김</text>
    </g>

    <!-- footer -->
    <text x="200" y="290" text-anchor="middle" font-family="'Pretendard','Segoe UI',sans-serif" font-size="11" font-weight="500" fill="#6B7385">© 2026 Leewonno. All rights reserved.</text>
  </g>
</svg>
